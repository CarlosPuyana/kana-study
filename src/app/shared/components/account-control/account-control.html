<a class="account" [routerLink]="auth.authenticated()?'/profile':'/auth'" [queryParams]="{return:returnUrl()}" [attr.aria-label]="i18n.t(auth.authenticated()?'account.profile':'account.signIn')" [attr.title]="i18n.t(auth.authenticated()?'account.profile':'account.signIn')"><span>{{auth.authenticated()?auth.initials():'♙'}}</span>@if(auth.authenticated()){<i [attr.data-status]="sync.status()" aria-hidden="true"></i>}</a>
