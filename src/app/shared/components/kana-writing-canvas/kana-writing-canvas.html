<svg class="writing-surface" viewBox="0 0 1024 1024" role="img" [attr.aria-label]="i18n.t('writing.surface')"
  (pointerdown)="pointerDown($event)" (pointermove)="pointerMove($event)" (pointerup)="pointerUp($event)"
  (pointercancel)="pointerUp($event)" (lostpointercapture)="pointerUp($event)">
  <path class="grid" d="M512 0V1024M0 512H1024"/><path class="diagonal" d="M0 0L1024 1024M1024 0L0 1024"/>
  @for(stroke of modelStrokes(); track stroke.key){
    <defs><clipPath [id]="stroke.key"><path [attr.d]="stroke.shape"/></clipPath></defs>
    @if(helpAvailable() && guideVisible()){<path class="model" [attr.d]="stroke.shape" [attr.transform]="stroke.transform"/>}
    @if(animation() && helpAvailable()){
      <g [attr.transform]="stroke.transform"><path class="animated" [attr.d]="stroke.median" [attr.clip-path]="'url(#'+stroke.key+')'" pathLength="1" [style.animation-delay]="stroke.order * 700 + 'ms'"/>
      <text class="stroke-number" x="60" [attr.y]="100+stroke.order*75" [style.animation-delay]="stroke.order * 700 + 'ms'">{{stroke.order+1}}</text></g>
    }
  }
  @for(points of drawnPaths(); track $index){<polyline class="ink" [attr.points]="points"/>}
</svg>
@if(loading()){<p class="status" role="status">{{i18n.t('writing.loading')}}</p>}
@if(error()){<p class="status" role="alert">{{i18n.t('writing.error')}}</p>}
<div class="writing-controls">
  <button type="button" (click)="undo()" [disabled]="!strokes().length">{{i18n.t('writing.undo')}}</button>
  <button type="button" (click)="clear()" [disabled]="!strokes().length">{{i18n.t('writing.clear')}}</button>
  @if(helpAvailable()){
    <button type="button" [attr.aria-pressed]="guideVisible()" (click)="guideVisible.set(!guideVisible())">{{i18n.t(guideVisible()?'writing.hideGuide':'writing.showGuide')}}</button>
    <button type="button" (click)="play()" [disabled]="loading()||error()">{{i18n.t('writing.strokes')}}</button>
  }
</div>
