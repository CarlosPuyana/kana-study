<a class="selection-card" [routerLink]="route()" [queryParams]="queryParams()">
  <span class="icon" aria-hidden="true">
    @switch (icon()) {
      @case ('target') {
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m14.7 9.3 5.6-5.6M17 3.7h3.3V7"/></svg>
      }
      @case ('cards') {
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      }
      @default {
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      }
    }
  </span>
  <span class="copy">
    <strong>{{ title() }}</strong>
    <span>{{ description() }}</span>
  </span>
  <span class="arrow" aria-hidden="true">→</span>
</a>
