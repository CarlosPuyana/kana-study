<main class="page-shell">
  <header class="page-header"><a class="icon-button" routerLink="/more" [queryParams]="{from:'anki'}" [attr.aria-label]="i18n.t('common.back')"><svg viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a><h1>{{i18n.t('anki.title')}}</h1><span></span></header>
  <section class="review" aria-labelledby="anki-review-title">
    <div class="section-heading"><span>{{i18n.t('anki.eyebrow')}}</span><h2 id="anki-review-title">{{i18n.t('anki.review')}}</h2></div>
    @if(error()){<p class="storage-error" role="alert">{{i18n.t('anki.storageError')}}</p>}
    <div class="deck-list">@for(deck of decks;track deck.id){@if(counts()[deck.id];as deckCounts){<app-deck-card [deck]="deck" [stats]="deckCounts" (newTodayAdjustment)="adjustNewToday(deck.id,$event)"/>} @else if(loading()){<div class="loading-card" aria-busy="true">{{i18n.t('common.loading')}}</div>}}</div>
  </section>
</main>
